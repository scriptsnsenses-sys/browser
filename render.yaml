services:
  - type: web
    name: dg-brows
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DG_BROWS_ALLOW_PRIVATE
        value: "false"
      - key: DG_BROWS_PAGE_TIMEOUT_MS
        value: "30000"
      - key: DG_BROWS_READER_TIMEOUT_MS
        value: "30000"
      - key: DG_BROWS_CORS_ORIGIN
        sync: false
